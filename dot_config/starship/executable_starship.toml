"$schema" = 'https://starship.rs/config-schema.json'

# ### ---------
# ### "Power10"
# ### ---------
# - Variant 2: two line prompt, no background in top line, separators on left side, filling solid line in top row
# - inspired by a powerlevel10k design-variant (https://github.com/romkatv/powerlevel10k)
#
# - Recommended / tested with Font 'MesloLGS NF Regular' from: Meslo Nerd Font patched for Powerlevel10k
#   Link: https://github.com/romkatv/powerlevel10k?tab=readme-ov-file#manual-font-installation
#         --> "Manual font installation", with currently 4 Font Types

# - If you do not want the filling solid line in top row:
#   Delete the line containing '$fill\' within format = """ ... """ # or set the fill symbol to ' '
# - Shell [shell]:
#   If you want to see the content of the shell module, search for [shell] and change 'disabled = true' to false
# - '$line_break': everything from the next line on refers to the second line of the prompt
# - Some modules listed further down will not show up (all the time), as their default value is 'disabled = true' or
#   they are only displayed under certain conditions
# - Symbols:
#   Don't be confused if you don't see any "real" symbols here. If Nerd-fonts are installed on your system, it should work.

# Customizing the prompt (and placing desired modules at desired position and sequence):
# ╭╴ # \u256D\u2574
# ╰╴ # \u2570\u2574
format = """
[\u256D\u2500\u2574](blue)\ 
$os\
$shell\
$username\
$hostname\
$sudo\
$directory\
$direnv\
$php\
$python\
$git_branch$git_commit$git_state$git_metrics$git_status\
[ ](fg:greydarker)\
$fill\
$fill\
$status\
$jobs\
$memory_usage\
$cmd_duration\
$line_break\
\
[\u2570\u2500](blue)\
[$character]($style)"""



# move the rest of the prompt to the right
right_format = """
[$localip]($style)"""

# Inserts a blank line between shell prompts:
add_newline = false

# Color Palette
palette = "Power10"

[character]
success_symbol = "[󰅂](blue)"
error_symbol = "[󰅂](bold red)"

[palettes.Power10]
# only lowercase names
greydimmed = '20'
greydarker = '8'
ossymbol = '21' # dimmed white
user = 'green'
userroot = 'red'
sshsymbol = 'green'
hostname = 'green'
sudo = 'red'
directory = 'cyan'
php = 'blue' # light blue
azure = 'blue'
python = 'yellow'
# git start ---
orangegit = '16'
conflicted = 'red'
ahead = 'yellow'
behind = 'yellow'
diverged = 'yellow'
uptodate = 'green'
untracked = 'red'
stashed = '17' # redbrown
modified = '11' # darker yellow
staged = 'green'
renamed = 'yellow'
deleted = 'orange'
# git end ---
jobs = 'blue'
memory = 'purple'
duration = 'yellow'
fill = '#fg:20' # greydimmed
status = 'red'
localip = 'green'
shell = 'fg:20' # greydimmed

# Customization and activation of some modules:
# Listed in the order of their position in the module rows above
[os]
format = "[$symbol]($style)()"
style = "green"
disabled = false

[os.symbols]
AlmaLinux = " "
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " " 
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = "⚡ "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = " "
Kali = " "
Linux = ""
Macos = " "
Manjaro = " "
MidnightBSD = " "
Mint = "󰣭 "
NetBSD = " "
NixOS = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = "∈"
openSUSE = " "
Pop = " "
Raspbian = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
RockyLinux = " " 
Solus = " "
SUSE = " "
Ubuntu = "󰌽 "
Unknown = " "
Void = " "
Windows = "󰖳 "

[shell]
format = '[$indicator]($style)()'
style = 'fg:shell'
zsh_indicator = '%_ ' # '%_ ' '󰰶 '
bash_indicator = '\$_ ' # "\uebca " ' ' '\$_ '
fish_indicator = '>> ' # "\uee41 " '󰈺 ' '>>_ '
powershell_indicator = '>_ ' # "\uebc7 " ' ' '>_'
unknown_indicator = '?_ ' # '?_ ' ' '
disabled = true # set to false if you want to see the shell indicator

[username]
format = "[$user]($style)[ ]()" # \u276F ❯ \ueab6 
style_user = 'fg:user bold'
style_root = 'fg:userroot bold'
show_always = false
disabled = false

[hostname]
format = '[$ssh_symbol ](fg:sshsymbol bold)[$hostname](fg:hostname bold)[ ]()'
ssh_only = true
ssh_symbol = " " # \ue36e '' # '⇒' # ' ' # 'ﬁ⇒'
# trim_at = '.companyname.com'
disabled = false

[sudo]
format = "[$symbol]($style)" # \u276F ❯ \ueab6 
style = 'orange'
symbol = " 󱈸 " # \uf007  # \uf21b \uedcc ' ' # ' '
disabled = false

[directory]
format = "[]()[$read_only]($read_only_style)[$repo_root]($repo_root_style)[$path ](cyan)" # \u276F ❯ \ueab6 
style = 'cyan'
home_symbol = "󰋜 ~" # \uf015 ' ~'
read_only = "󰌾 " # \uf023 ' '
read_only_style = '16'
truncation_length = 30
truncation_symbol = '…/'
truncate_to_repo = true
repo_root_format = "[󰊢 ](fg:directory bold)[$read_only]($read_only_style)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[ ]()" # \u276F ❯ \ueab6 
repo_root_style = 'fg:cyan bold'
use_os_path_sep = true
disabled = false

[direnv]
symbol = 'direnv'
style = 'fg:greydimmed'
format = "[ $symbol $loaded/$allowed ]($style)"
allowed_msg = 'a' # 'ok' # '✓'
not_allowed_msg = '!a' # 'nok' # '!'
denied_msg = 'x' # '✘'
loaded_msg = '+' # "\ueabc" # \ueabc  # '->' # 'yo' # '󰗡' # \udb81\udde1 # '󱥸✓' # '󱥸✓' # 
unloaded_msg = '-' # "\ueabc!" # \ueabc ! # '->!' # 'no' # '󰅚' # '󱥸!' \udb86\udd78
disabled = false


[azure]
format = " [ [$symbol](php italic)($version )]($style)"
style = 'fg:azure'
symbol = " " # \ue73d  # 󰌟


[php]
format = " [ [$symbol](php italic)($version )]($style)"
style = 'fg:php'
symbol = "php " # \ue73d  # 󰌟

[python]
format = "[ ${symbol}${pyenv_prefix}(${version} )(($virtualenv) )]($style)"
style = 'fg:python'
symbol = "󰌠 " # 
pyenv_version_name = true

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style)[ ]()"
style = 'fg:green'
symbol = " "

[git_commit]
format = '[\($hash$tag\)]($style)[ ]()'
style = 'fg:green'
commit_hash_length = 8
tag_symbol = " 󰓹 "
tag_disabled = false
disabled = false

[git_metrics]
format = '[\[+$added/]($added_style)[-$deleted\]]($deleted_style)[ ]()'
added_style = 'fg:green'
deleted_style = 'fg:green'
disabled = false

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = 'fg:green'
conflicted = "[ ${count} ](fg:conflicted)"
ahead = "[󰁝 ${count} ](fg:ahead)" # ⇡ \ueaa0
behind = "[󰁅 ${count} ](fg:behind)" # ⇣ \uea9d
diverged = "[󰹹 󰄿 ${ahead_count} 󰄼 ${behind_count} ](fg:diverged)" # \u2195\u21E1 ⇕ ↕ ⇳ 󰹹 󰹺 󰧈
up_to_date = "[󰄬 ](fg:uptodate)" # \u2714 ✔ \u2713 \ueab2 ✓
untracked = "[󰨹 ${count} ](fg:untracked)" # 󰟉 \uf441 \ueb32 ﳇ ' ' # '? '
stashed = "[󰏗 ${count} ](fg:stashed)" # \ueb29  '📦 '# ' ' # ' ' # ' ' # ' '
modified = "[󱓦 ${count} ](fg:modified)" # \uf040 󰷉 '📝' # '! ' #  #  #  \uf044 \uea73
staged = "[ ${count} ](fg:staged)" # \u26DF  '+ '
renamed = "[󰳷 ${count} ](fg:renamed)" # \u0373 \ueb69  ' ' # '﫦' # ᴂ #  #  #  # ﳳ
deleted = "[󰩺 ${count} ](fg:deleted)" # \uea81 \uf507 ﯊ '🗑 ' '- '
disabled = false

[fill]
style = 'fg:fill'
symbol = " " # "\u2500" "─" # no line: ' '

[status]
format = "[ $symbol$common_meaning($signal_name $signal_number)]($style)" # \uf0a2  , \ueaa2
style = 'fg:status'
map_symbol = true
not_found_symbol = "󰍉 "
not_executable_symbol = "󰜺 "
sigint_symbol = ""
success_symbol = ""
signal_symbol = "󱐋 "

symbol = " " # \u2717 \uf467 \uebde  ✘
disabled = false

[jobs]
format = "[ \ueab5 ](fg:jobs bold)[$symbol $number]($style)" #  
style = 'fg:jobs'
symbol = "󰜎 " # \ueb7b  \uef0c 省 # '廒' # '󰜎' # ''
symbol_threshold = 1
number_threshold = 2
disabled = false

[memory_usage]
format = "[ \ueab5 ](fg:memory bold)[$symbol ${ram} ${swap}]($style)" #  
style = "fg:memory"
symbol = "󰍛 󰯍" # "\ueb50 \uebcb" \uf1ec '﬙ 北' '﬙ 痢' # '﬙ 󰾵' # '󰍛 󰾵' # '﬙ 󰾴' # '﬙ 󰾶' '﬙ 󰣂'
threshold = 75
disabled = false

[cmd_duration]
format = "[  $duration]($style)" # \ueab5 \uf017   
style = 'fg:duration'
min_time = 500
disabled = false

[localip]
format = '[$localipv4](fg:localip bold)'
ssh_only = true
disabled = false
